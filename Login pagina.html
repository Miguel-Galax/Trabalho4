<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .login-form {
            border: 2px solid #333;
            padding: 20px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }

        h1 { text-align: center; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; margin-top: 10px; }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        input[type="submit"]:hover {
            background-color: #555;
        }

        .mensagem-erro {
            color: red;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none; /* Escondido por padrão */
        }
    </style>
</head>
<body>

    <div class="login-form">
        <h1>Login</h1>
        <form id="meuFormulario">
            <label for="femail">Email</label>
            <input type="email" id="femail" placeholder="exemplo@email.com" required>

            <label for="fsenha">Senha</label>
            <input type="password" id="fsenha" placeholder="Sua senha" required>

            <input type="submit" value="Entrar">
        </form>
        <div id="erro" class="mensagem-erro">Usuário não encontrado. Por favor, cadastre-se!</div>
    </div>

    <script>
        // Dados de teste
        const USUARIO_VALIDO = {
            email: "teste@email.com",
            senha: "123456"
        };

        const formulario = document.getElementById('meuFormulario');
        const msgErro = document.getElementById('erro');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault(); // Impede o recarregamento da página

            const emailDigitado = document.getElementById('femail').value;
            const senhaDigitada = document.getElementById('fsenha').value;

            if (emailDigitado === USUARIO_VALIDO.email && senhaDigitada === USUARIO_VALIDO.senha) {
                // Se os dados estiverem corretos:
                msgErro.style.display = "none";
                alert("Login realizado com sucesso! Redirecionando...");
                
                // Redireciona para a página desejada
                window.location.href = "compras.html"; 
            } else {
                // Se estiver errado, mostra a mensagem de erro
                msgErro.style.display = "block";
            }
        });
    </script>
</body>
</html>
