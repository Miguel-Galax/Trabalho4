<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login pagina</title>
</head>
<body>
    <center>
    
     <form class="borda de texto">
        <h1>
            Login
        </h1><br>
        <label for="fname" name="fname" required>Nome</label><br>
        <input type="text" id="fname" name="fname" required><br>

        <label for="fsenha" name="fsenha" required>Senha</label><br>
        <input type="password" id="fsenha" name="fsenha" required><br>

        <label for="ftele">Telefone</label><br>
        <input type="tel" id="ftele" name="ftele" required><br>

        <label for="femail">Email</label><br>
        <input type="email" id="femail" name="femail" required><br>

        <input type="submit" value="Enviar">
     </form>
    </center>

      <script>
        const formulario = document.querySelector('form');

        formulario.addEventListener('submit', function(event) {

            event.preventDefault();

            const nome = document.getElementById('fname').value;
            const email = document.getElementById('femail').value;

            alert(`Olá ${nome}! Seu login com o e-mail ${email} foi enviado com sucesso.`);
            
            console.log("Dados prontos para envio!");
        });
    </script>
</body>
</html>
